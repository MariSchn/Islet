<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#241552"/>
      <stop offset="0.5" stop-color="#5a2a9c"/>
      <stop offset="0.82" stop-color="#d9477f"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#b98cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b98cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="notchShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#12002e" flood-opacity="0.7"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <g filter="url(#shadow)">
    <g clip-path="url(#squircle)">
      <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
      <g fill="none" stroke="#fff" stroke-linecap="round">
        <path d="M60 760 C 220 720, 360 800, 512 760 S 800 720, 980 760" stroke-opacity="0.22" stroke-width="10"/>
        <path d="M60 830 C 220 790, 360 870, 512 830 S 800 790, 980 830" stroke-opacity="0.16" stroke-width="10"/>
        <path d="M60 900 C 220 860, 360 940, 512 900 S 800 860, 980 900" stroke-opacity="0.1" stroke-width="10"/>
      </g>

      <rect x="100" y="100" width="824" height="824" fill="url(#sheen)" opacity="0.5"/>
      <g filter="url(#notchShadow)">
        <path d="M232 100 Q 262 100 262 130 L 262 262 Q 262 352 352 352 L 672 352 Q 762 352 762 262 L 762 130 Q 762 100 792 100 Z" fill="#000"/>
      </g>

      <g transform="translate(640 226)">
        <circle r="52" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="22"/>
        <g fill="none" stroke-width="22" stroke-linecap="round" transform="rotate(-90)">
          <circle r="52" stroke="#ff9f0a" stroke-dasharray="80 247" stroke-dashoffset="0"/>
          <circle r="52" stroke="#66a6ff" stroke-dasharray="80 247" stroke-dashoffset="-109"/>
          <circle r="52" stroke="#32d74b" stroke-dasharray="80 247" stroke-dashoffset="-218"/>
        </g>
      </g>
      <rect x="352" y="206" width="170" height="40" rx="20" fill="#fff" fill-opacity="0.92"/>

    </g>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>
  </g>
</svg>
