name: Islet
options:
  bundleIdPrefix: com.marischn
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  IsletCore:
    path: Packages/IsletCore
  IsletHost:
    path: Packages/IsletHost
  HelloPlugin:
    path: Plugins/HelloPlugin
  ShelfPlugin:
    path: Plugins/ShelfPlugin
  MediaPlugin:
    path: Plugins/MediaPlugin
  AgentsPlugin:
    path: Plugins/AgentsPlugin
  CalendarPlugin:
    path: Plugins/CalendarPlugin
  GitHubPlugin:
    path: Plugins/GitHubPlugin
  TimerPlugin:
    path: Plugins/TimerPlugin
targets:
  Islet:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: IsletCore
      - package: IsletHost
      - package: HelloPlugin
      - package: ShelfPlugin
      - package: MediaPlugin
      - package: AgentsPlugin
      - package: CalendarPlugin
      - package: GitHubPlugin
      - package: TimerPlugin
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Islet
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: Islet controls your music player to show what's playing, and your terminal to bring an agent's session to the front.
        NSCalendarsFullAccessUsageDescription: Islet shows your upcoming events in the notch.
    settings:
      base:
        PRODUCT_NAME: Islet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        MACOSX_DEPLOYMENT_TARGET: "15.0"
schemes:
  Islet:
    build:
      targets:
        Islet: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: IsletCore/IsletCoreTests
        - package: IsletHost/IsletHostTests
        - package: ShelfPlugin/ShelfPluginTests
        - package: MediaPlugin/MediaPluginTests
        - package: AgentsPlugin/AgentsPluginTests
        - package: CalendarPlugin/CalendarPluginTests
        - package: GitHubPlugin/GitHubPluginTests
        - package: TimerPlugin/TimerPluginTests
